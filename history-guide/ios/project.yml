# Generate StreetHistorian.xcodeproj with:  brew install xcodegen && xcodegen
name: StreetHistorian
options:
  bundleIdPrefix: org.muirhead
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  StreetHistorian:
    type: application
    platform: iOS
    sources: [StreetHistorian]
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: StreetHistorian/Info.plist
      properties:
        CFBundleDisplayName: Street Historian
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Street Historian uses your location and the direction you're facing to work out what you're looking at.
        NSMicrophoneUsageDescription: Street Historian listens to your question when you tap Ask.
        NSSpeechRecognitionUsageDescription: Street Historian turns your spoken question into text.
        GuideAPIURL: $(GUIDE_API_URL)
        GuideAPIKey: $(GUIDE_API_KEY)
