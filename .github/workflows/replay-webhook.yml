name: Replay Webhook

on:
  workflow_dispatch:

jobs:
  replay:
    name: Replay webhook for contact 99886401
    runs-on: ubuntu-latest
    steps:
      - name: Install requests
        run: pip install requests

      - name: Replay all three payloads
        env:
          SECRET: ${{ secrets.WILD_APRICOT_WEBHOOK_SECRET }}
        run: |
          python3 << 'EOF'
          import os, requests

          secret = os.environ["SECRET"]
          url = f"https://ryetri-prod-func.azurewebsites.net/api/webhook/wild-apricot?secret={secret}"

          payloads = [
              # Chronological order per WA webhook log
              ("5:31 PM — StatusChanged Status 20 (Active) — expect pass + email",
               {"AccountId":"530477","MessageType":"Membership","Parameters":{"Action":"StatusChanged","Contact.Id":"99886401","Membership.LevelId":"1828218","Membership.Status":"20"}}),
              ("5:37 PM — StatusChanged Status 1 — expect no email",
               {"AccountId":"530477","MessageType":"Membership","Parameters":{"Action":"StatusChanged","Contact.Id":"99886401","Membership.LevelId":"1828218","Membership.Status":"1"}}),
              ("5:37 PM — RenewalDateChanged Status 0 — expect no email",
               {"AccountId":"530477","MessageType":"Membership","Parameters":{"Action":"RenewalDateChanged","Contact.Id":"99886401","Membership.LevelId":"1828218","Membership.Status":"0"}}),
          ]

          for label, body in payloads:
              resp = requests.post(url, json=body, timeout=60)
              print(f"\n=== {label} ===")
              print(f"HTTP {resp.status_code}: {resp.text[:200] or '(empty)'}")
          EOF
