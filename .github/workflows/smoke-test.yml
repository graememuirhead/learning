name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

jobs:
  smoke:
    name: Smoke Tests (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-test.txt requests

      - name: Set function URL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "SMOKE_FUNCTION_URL=https://ryetri-prod-func.azurewebsites.net/api" >> $GITHUB_ENV
          else
            echo "SMOKE_FUNCTION_URL=https://ryetri-dev-func.azurewebsites.net/api" >> $GITHUB_ENV
          fi

      - name: Run smoke test #1 (welcome email via webhook)
        env:
          DEV_FUNCTION_URL: ${{ env.SMOKE_FUNCTION_URL }}
          DEV_WEBHOOK_SECRET: ${{ secrets.WILD_APRICOT_WEBHOOK_SECRET }}
        run: |
          pytest tests/integration/test_smoke_email.py::test_smoke_welcome_email \
            -v -m smoke -s
