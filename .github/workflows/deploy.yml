name: Deploy Rye Tri Membership API to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ryetri-prod-func
  PYTHON_VERSION: '3.11'
  TF_WORKING_DIR: infra/terraform

jobs:
  # --------------------------------------------------------------------------
  # Unit tests — gate everything; no Azure credentials needed
  # --------------------------------------------------------------------------
  test_unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v

  # --------------------------------------------------------------------------
  # Integration tests against dev — verify dev is healthy before touching prod
  # --------------------------------------------------------------------------
  integration_test:
    name: Integration Tests (dev)
    runs-on: ubuntu-latest
    needs: test_unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install -r requirements-test.txt requests

      - name: Azure CLI Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get dev function app key and storage connection string
        run: |
          KEY=$(az functionapp keys list \
            --name ryetri-dev-func \
            --resource-group ryetri-dev-rg \
            --query 'functionKeys.default' -o tsv)
          CONN=$(az storage account show-connection-string \
            --name ryetridevst \
            --resource-group ryetri-dev-rg \
            --query connectionString -o tsv)
          echo "DEV_FUNCTION_KEY=$KEY" >> $GITHUB_ENV
          echo "DEV_STORAGE_CONNECTION_STRING=$CONN" >> $GITHUB_ENV

      - name: Run integration tests against dev
        env:
          DEV_FUNCTION_URL: https://ryetri-dev-func.azurewebsites.net/api
          DEV_WEBHOOK_SECRET: ${{ secrets.WILD_APRICOT_WEBHOOK_SECRET }}
        run: pytest tests/integration/ -v -m "not smoke"

  # --------------------------------------------------------------------------
  # Deploy infrastructure with Terraform
  # --------------------------------------------------------------------------
  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    needs: integration_test
    outputs:
      function_app_name:    ${{ steps.tf_output.outputs.function_app_name }}
      storage_account_name: ${{ steps.tf_output.outputs.storage_account_name }}
      static_website_url:   ${{ steps.tf_output.outputs.static_website_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
        run: |
          terraform init -reconfigure \
            -backend-config="access_key=${{ secrets.AZURE_TFSTATE_KEY }}"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
          TF_VAR_environment:                prod
          TF_VAR_location:                   centralus
          TF_VAR_apple_team_identifier:      ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          TF_VAR_apple_pass_certificate_pem: ${{ secrets.APPLE_PASS_CERTIFICATE_PEM }}
          TF_VAR_apple_pass_key_pem:         ${{ secrets.APPLE_PASS_KEY_PEM }}
          TF_VAR_apple_wwdr_certificate_pem: ${{ secrets.APPLE_WWDR_CERTIFICATE_PEM }}
          TF_VAR_apple_key_password:         ${{ secrets.APPLE_KEY_PASSWORD }}
          TF_VAR_google_issuer_id:            ${{ secrets.GOOGLE_ISSUER_ID }}
          TF_VAR_google_service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_sendgrid_api_key:            ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_wild_apricot_webhook_secret: ${{ secrets.WILD_APRICOT_WEBHOOK_SECRET }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
          TF_VAR_environment:                prod
          TF_VAR_location:                   centralus
          TF_VAR_apple_team_identifier:      ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          TF_VAR_apple_pass_certificate_pem: ${{ secrets.APPLE_PASS_CERTIFICATE_PEM }}
          TF_VAR_apple_pass_key_pem:         ${{ secrets.APPLE_PASS_KEY_PEM }}
          TF_VAR_apple_wwdr_certificate_pem: ${{ secrets.APPLE_WWDR_CERTIFICATE_PEM }}
          TF_VAR_apple_key_password:         ${{ secrets.APPLE_KEY_PASSWORD }}
          TF_VAR_google_issuer_id:            ${{ secrets.GOOGLE_ISSUER_ID }}
          TF_VAR_google_service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TF_VAR_sendgrid_api_key:            ${{ secrets.SENDGRID_API_KEY }}
          TF_VAR_wild_apricot_webhook_secret: ${{ secrets.WILD_APRICOT_WEBHOOK_SECRET }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT
          echo "storage_account_name=$(terraform output -raw storage_account_name)" >> $GITHUB_OUTPUT
          echo "static_website_url=$(terraform output -raw static_website_url)" >> $GITHUB_OUTPUT

  # --------------------------------------------------------------------------
  # Build & deploy the Function App
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (manylinux2014 wheels for Azure Linux compat)
        run: |
          python -m pip install --upgrade pip
          pip install \
            --platform manylinux_2_17_x86_64 \
            --python-version 311 \
            --only-binary=:all: \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      - name: Azure CLI Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.function_app_name }}
          package: '.'
          scm-do-build-during-deployment: false

      - name: Print deployment URL
        run: |
          echo "API deployed to: https://${{ needs.infrastructure.outputs.function_app_name }}.azurewebsites.net/api"

  # --------------------------------------------------------------------------
  # Deploy static website (reissue page)
  # --------------------------------------------------------------------------
  deploy_static:
    name: Deploy Static Website
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Azure CLI Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload reissue page and logo
        run: |
          STORAGE="${{ needs.infrastructure.outputs.storage_account_name }}"
          FUNC_APP="${{ needs.infrastructure.outputs.function_app_name }}"
          API_URL="https://${FUNC_APP}.azurewebsites.net/api"

          sed "s|__API_BASE_URL__|${API_URL}|g" static/index.html > /tmp/index.html

          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$STORAGE" \
            --query '[0].value' -o tsv)

          az storage blob upload \
            --account-name "$STORAGE" --account-key "$ACCOUNT_KEY" \
            --container-name '$web' --name index.html \
            --file /tmp/index.html --content-type text/html --overwrite

          az storage blob upload \
            --account-name "$STORAGE" --account-key "$ACCOUNT_KEY" \
            --container-name '$web' --name logo.png \
            --file assets/logo.png --content-type image/png --overwrite

          echo "Reissue page: ${{ needs.infrastructure.outputs.static_website_url }}"
