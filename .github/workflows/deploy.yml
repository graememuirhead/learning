name: Deploy Rye Tri Membership API to Azure

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ryetri-prod-func
  PYTHON_VERSION: '3.11'
  TF_WORKING_DIR: infra/terraform

jobs:
  # --------------------------------------------------------------------------
  # Deploy infrastructure with Terraform
  # --------------------------------------------------------------------------
  infrastructure:
    name: Terraform
    runs-on: ubuntu-latest
    outputs:
      function_app_name: ${{ steps.tf_output.outputs.function_app_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
          TF_VAR_apple_team_identifier:      ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          TF_VAR_apple_pass_certificate_pem: ${{ secrets.APPLE_PASS_CERTIFICATE_PEM }}
          TF_VAR_apple_pass_key_pem:         ${{ secrets.APPLE_PASS_KEY_PEM }}
          TF_VAR_apple_wwdr_certificate_pem: ${{ secrets.APPLE_WWDR_CERTIFICATE_PEM }}
          TF_VAR_apple_key_password:         ${{ secrets.APPLE_KEY_PASSWORD }}
          TF_VAR_google_issuer_id:            ${{ secrets.GOOGLE_ISSUER_ID }}
          TF_VAR_google_service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
          TF_VAR_apple_team_identifier:      ${{ secrets.APPLE_TEAM_IDENTIFIER }}
          TF_VAR_apple_pass_certificate_pem: ${{ secrets.APPLE_PASS_CERTIFICATE_PEM }}
          TF_VAR_apple_pass_key_pem:         ${{ secrets.APPLE_PASS_KEY_PEM }}
          TF_VAR_apple_wwdr_certificate_pem: ${{ secrets.APPLE_WWDR_CERTIFICATE_PEM }}
          TF_VAR_apple_key_password:         ${{ secrets.APPLE_KEY_PASSWORD }}
          TF_VAR_google_issuer_id:            ${{ secrets.GOOGLE_ISSUER_ID }}
          TF_VAR_google_service_account_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_ACCESS_KEY:      ${{ secrets.AZURE_TFSTATE_KEY }}
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> $GITHUB_OUTPUT

  # --------------------------------------------------------------------------
  # Build & deploy the Function App
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy Function App
    runs-on: ubuntu-latest
    needs: infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure CLI Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.function_app_name }}
          package: '.'
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: Print deployment URL
        run: |
          echo "API deployed to: https://${{ needs.infrastructure.outputs.function_app_name }}.azurewebsites.net/api"
