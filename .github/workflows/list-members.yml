name: List Prod Members

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get storage connection string
        run: |
          CONN=$(az storage account show-connection-string \
            --name ryetriprodst \
            --resource-group ryetri-prod-rg \
            --query connectionString -o tsv)
          echo "STORAGE_CONNECTION_STRING=$CONN" >> $GITHUB_ENV

      - name: Count and list active members
        env:
          STORAGE_CONNECTION_STRING: ${{ env.STORAGE_CONNECTION_STRING }}
        run: |
          pip install azure-data-tables -q
          python3 << 'EOF'
          import os
          from azure.data.tables import TableServiceClient

          conn = os.environ["STORAGE_CONNECTION_STRING"]
          service = TableServiceClient.from_connection_string(conn)
          client = service.get_table_client("IssuedPasses")

          entities = list(client.query_entities(
              "PartitionKey eq 'RyeTri'",
              select=["Name", "MemberNumber", "ExpiryDate", "Voided"],
          ))

          seen = set()
          active = []
          for e in entities:
              if e.get("Voided"):
                  continue
              name = (e.get("Name") or "").strip().lower()
              if "test member" in name:
                  continue
              mn = e.get("MemberNumber", "")
              if mn not in seen:
                  seen.add(mn)
                  active.append(e)

          print(f"\nTotal active members: {len(active)}\n")
          for m in sorted(active, key=lambda x: x.get("Name", "")):
              print(f"  {m.get('Name',''):<30} #{m.get('MemberNumber',''):<10} expires {m.get('ExpiryDate','')}")
          EOF
